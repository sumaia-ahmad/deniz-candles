server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Order photos and payment receipts can be up to 10 MB.
    client_max_body_size 12m;

    # API requests go to the Flask backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: /order, /track/..., /admin/... are handled by React.
    location / {
        try_files $uri /index.html;
    }
}
