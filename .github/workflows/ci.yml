name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Migrations build a fresh database
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
          SECRET_KEY: ci-only
        run: |
          flask --app app db upgrade
          flask --app app db check   # fails if a model change has no migration

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: Docker (full stack on PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create secrets for this run
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Migrations match the models on PostgreSQL
        run: docker compose exec -T backend flask --app app db check
      - name: Load the catalog and create an account
        run: |
          docker compose exec -T backend flask --app app seed
          docker compose exec -T backend flask --app app create-user ci --password ci-password-123
      - name: Smoke test through Nginx
        run: |
          set -e
          base=http://localhost:8080
          curl -fsS $base/ | grep -q '<div id="root">'
          curl -fsS $base/order | grep -q '<div id="root">'          # single-page app routes
          test "$(curl -fsS $base/api/products | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')" = 17
          curl -fsS -o /dev/null $base/api/media/products/gifts-11.jpg
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password-123"}' $base/api/auth/login > /dev/null
          curl -fsS -b jar $base/api/admin/orders > /dev/null
          echo "Full stack works ✓"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
